<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظریه‌یار - دستیار هوشمند تحلیل کیفی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0;
            padding: 4rem 1rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #f1f5f9;
        }
        h1 {
            color: #0c2585;
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }
        p.desc {
            color: #64748b;
            font-size: 1rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        textarea {
            width: 100%;
            height: 240px;
            padding: 1.25rem;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.95rem;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s ease;
            background-color: #ffffff;
        }
        textarea:focus {
            border-color: #3969ff;
            box-shadow: 0 0 0 3px rgba(57, 105, 255, 0.1);
        }
        button {
            background-color: #3969ff;
            color: white;
            border: none;
            padding: 0.9rem 2rem;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 1.5rem;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 500;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        button:hover {
            background-color: #0c2585;
        }
        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>نظریه‌یار</h1>
        <p class="desc">دستیار هوشمند تحلیل مصاحبه‌های کیفی با متدولوژی داده‌بنیاد (Grounded Theory)</p>
        <form action="/analyze" method="post">
            <textarea name="interview_text" placeholder="متن مصاحبه، یادداشت‌های میدان یا پیاده‌سازی جلسات کیفی را اینجا وارد کنید..." required></textarea>
            <br>
            <button type="submit">شروع تحلیل و استخراج مدل پارادایمی</button>
        </form>
    </div>
</body>
</html>
