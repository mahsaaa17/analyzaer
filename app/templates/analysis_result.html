<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتیجه تحلیل نظریه‌پردازی - نظریه‌یار</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid #f1f5f9;
        }
        h2 {
            color: #001238;
            font-size: 1.25rem;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 0.75rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
        }
        .box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 1.25rem;
            border-radius: 10px;
            font-size: 0.95rem;
            line-height: 1.8;
            max-height: 160px;
            overflow-y: auto;
            color: #334155;
        }
        ul.codes-list {
            margin: 0;
            padding-right: 1.25rem;
        }
        ul.codes-list li {
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
            color: #334155;
        }
        .core-badge {
            display: inline-block;
            background-color: #eff6ff;
            color: #0c2585;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            font-weight: 600;
            border: 1px solid #bfdbfe;
            font-size: 1rem;
            margin-top: 0.5rem;
        }
        #network-chart {
            width: 100%;
            height: 500px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background-color: #ffffff;
            margin-top: 1rem;
        }
        .back-link {
            display: inline-block;
            margin-top: 2rem;
            color: #3969ff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>متن مصاحبه ورودی</h2>
        <div class="box">{{ interview_text }}</div>

        <h2>مقوله مرکزی (Core Category)</h2>
        <div class="core-badge">✨ {{ core_category }}</div>

        <h2>کدهای باز (Open Codes) استخراج‌شده</h2>
        <div class="box" style="max-height: 180px;">
            <ul class="codes-list">
                {% for code in open_codes %}
                <li>{{ code }}</li>
                {% endfor %}
            </ul>
        </div>

        <h2>مدل پارادایمی و نمودار مفهومی (Grounded Theory Diagram)</h2>
        <div id="network-chart"></div>

        <a href="/" class="back-link">← تحلیل مصاحبه جدید</a>
    </div>

    <script>
        const nodesArray = [
            {% for cat in categories %}
            { id: {{ cat.id }}, label: "{{ cat.label }}", group: "{{ cat.group }}" },
            {% endfor %}
        ];

        const edgesArray = [
            {% for rel in relations %}
            { from: {{ rel.from }}, to: {{ rel.to }}, label: "{{ rel.label }}", arrows: "to" },
            {% endfor %}
        ];

        const container = document.getElementById('network-chart');
        const data = {
            nodes: new vis.DataSet(nodesArray),
            edges: new vis.DataSet(edgesArray)
        };
        
        const options = {
            nodes: {
                shape: 'box',
                margin: 14,
                font: { face: 'Vazirmatn', size: 14, color: '#0f172a' },
                color: { background: '#ffffff', border: '#3969ff' },
                borderRadius: 8,
                shadow: true
            },
            edges: {
                font: { face: 'Vazirmatn', size: 12, align: 'middle', color: '#64748b' },
                color: { color: '#94a3b8' },
                width: 2,
                smooth: { type: 'cubicBezier' }
            },
            physics: {
                stabilization: true
            }
        };

        const network = new vis.Network(container, data, options);
    </script>
</body>
</html>
